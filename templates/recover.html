{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Sign in with a backup code</h1>
  <p class="muted">For when your passkey device is lost. Each code works once.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required>
    <label for="code">Backup code</label>
    <input id="code" name="code" placeholder="xxxxx-xxxxx" autocomplete="one-time-code" required>
    <button class="primary">Sign in</button>
  </form>
</div>
{% endblock %}
