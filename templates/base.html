<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Passwordless Auth{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('auth.index') }}">Passwordless Auth</a>
  <nav>
    {% if user %}
      <a href="{{ url_for('account.home') }}">Account</a>
      {% if user.role == 'admin' %}<a href="{{ url_for('admin.home') }}">Admin</a>{% endif %}
      <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link">Sign out</button>
      </form>
    {% else %}
      <a href="{{ url_for('auth.login') }}">Sign in</a>
      <a href="{{ url_for('auth.signup') }}">Create account</a>
    {% endif %}
  </nav>
</header>
<main class="{% block width %}narrow{% endblock %}">
  {% for cat, msg in flashes() %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  <div id="js-msg" class="flash error hidden" role="alert"></div>
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='webauthn.js') }}"></script>
</body>
</html>
