{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Reset my passkeys</h1>
  <p class="muted">Removes every passkey and signs out every device. You need two things: access to your
    inbox <b>and</b> one backup code. Lost both? Ask the administrator.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required>
    <button class="primary">Send reset link</button>
  </form>
</div>
{% endblock %}
