{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Confirm it's you</h1>
  <p class="muted">Please confirm your identity to continue.</p>
  {% if has_passkey %}
    <button class="primary big" id="passkey-reauth" data-next="{{ next }}">Confirm with passkey</button>
  {% endif %}
  {% if not passkey_only %}
    <div class="or"><span>or</span></div>
    <form method="post" action="{{ url_for('auth.reauth_backup') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="code">Use a backup code</label>
      <div class="row"><input id="code" name="code" placeholder="xxxxx-xxxxx" required><button>Confirm</button></div>
    </form>
  {% elif not has_passkey %}
    <p>The admin area requires a passkey. Register one first.</p>
  {% endif %}
</div>
{% endblock %}
