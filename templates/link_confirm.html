{% extends "base.html" %}
{% block content %}
<div class="card center">
  <h1>Continue?</h1>
  <p class="muted">Press the button to continue.</p>
  <form method="post" action="{{ url_for('auth.link_consume') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="t" value="{{ token }}">
    <button class="primary big">Continue</button>
  </form>
</div>
{% endblock %}
