{% extends "base.html" %}
{% block title %}Sign in · Passwordless Lab{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign in</h1>
  <p class="muted">No password. Use the passkey on this device (Windows Hello, fingerprint, phone).</p>
  <button class="primary big" id="passkey-login">&#128273; Sign in with a passkey</button>

  <div class="or"><span>or</span></div>

  <form method="post" action="{{ url_for('auth.magic_request') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail me a one-time sign-in link</label>
    <div class="row">
      <input id="email" name="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required>
      <button>Send link</button>
    </div>
  </form>
  <p class="small links">
    <a href="{{ url_for('auth.recover') }}">Lost your device? Use a backup code</a> &middot;
    <a href="{{ url_for('auth.reset_request') }}">Reset my passkeys</a> &middot;
    <a href="{{ url_for('auth.signup') }}">Create an account</a>
  </p>
</div>
{% endblock %}
